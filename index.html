<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Forever</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{
  margin:0; min-height:100vh; background:radial-gradient(circle at top,#ff7e9d,#7a1f3a,#1a0a0f);
  display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; overflow:hidden;
}
.glass{
  backdrop-filter: blur(20px); background: rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2); border-radius:30px; padding:40px 30px; width:90%; max-width:420px;
  text-align:center; color:white; position:relative; z-index:10; box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
h1{ font-family:'Great Vibes',cursive; font-size:48px; margin:0; }
.final-msg{ margin-top:25px; font-size:18px; line-height:1.6; font-weight:300; }
.final-msg b{ font-weight:600; color:#ffd1dc; }
.heart{ font-size:32px; animation: pulse 1.5s infinite; }
@keyframes pulse{ 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

/* Floating Love Tags */
.tag{
  position:absolute; font-family:'Great Vibes',cursive; font-size:22px; color:rgba(255,255,255,0.9);
  background:rgba(255,255,255,0.15); padding:6px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.2);
  animation: float 6s ease-in-out infinite; white-space:nowrap;
}
@keyframes float{
  0%,100%{ transform: translateY(0) rotate(-3deg); }
  50%{ transform: translateY(-20px) rotate(3deg); }
}
.t1{ top:10%; left:8%; animation-delay:0s; }
.t2{ top:15%; right:10%; animation-delay:1s; }
.t3{ bottom:20%; left:12%; animation-delay:2s; }
.t4{ bottom:12%; right:8%; animation-delay:0.5s; }
.t5{ top:45%; left:5%; animation-delay:1.5s; }
.t6{ top:40%; right:5%; animation-delay:2.5s; }
</style>
</head>
<body>

<span class="tag t1">My Queen 👑</span>
<span class="tag t2">My Soulmate 💫</span>
<span class="tag t3">My Everything ❤️</span>
<span class="tag t4">My Forever ♾️</span>
<span class="tag t5">My Home 🏡</span>
<span class="tag t6">My Peace 🕊️</span>

<div class="glass">
  <div class="heart">❤️</div>
  <h1>For You</h1>
  <div class="final-msg">
    I have so much to tell you...<br><br>
    But for now just know this —<br>
    <b>When we meet, I'm going to hold you so tight and never let go.</b><br><br>
    You are my today and all of my tomorrows.
  </div>
</div>

</body>
</html>
